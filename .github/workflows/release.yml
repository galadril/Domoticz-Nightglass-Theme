name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git describe and log

      # ── 1. Find the most recent tag ──────────────────────────────────────
      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ── 2. Decide patch vs minor bump ────────────────────────────────────
      #   minor  →  any commit message starting with "feat:" or "feature:"
      #   patch  →  everything else (default)
      - name: Determine bump type
        id: bump
        run: |
          COMMITS=$(git log "${{ steps.latest_tag.outputs.tag }}..HEAD" \
                        --pretty=format:"%s" 2>/dev/null || true)
          if echo "$COMMITS" | grep -qiE "^(feat|feature)[:(]"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # ── 3. Compute the next semver tag ───────────────────────────────────
      - name: Compute next version
        id: version
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "${{ steps.bump.outputs.type }}" in
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1))           ;;
          esac
          echo "next=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      # ── 4. Stamp THEME_VERSION in custom.js ──────────────────────────────
      #   Keeps the cache-busting query string on src/js/*.js in step with
      #   the release tag, so a browser that cached the theme before this
      #   release fetches fresh files instead of running stale code.
      - name: Update THEME_VERSION
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          VERSION="${NEXT#v}"
          sed -i "s/var THEME_VERSION = '.*';/var THEME_VERSION = '${VERSION}';/" custom.js
          grep "THEME_VERSION" custom.js

      # ── 5. Commit the version bump, then push the new tag ────────────────
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- custom.js; then
            git add custom.js
            git commit -m "chore: bump THEME_VERSION to ${{ steps.version.outputs.next }}"
            git push origin HEAD:main
          fi
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      # ── 6. Publish GitHub release with auto-generated notes ──────────────
      #   Bundles the theme into a zip so users can install by extracting
      #   the folder into www/styles/nightglass/. Includes README for
      #   installation instructions.
      - name: Bundle theme zip
        run: |
          zip -r "nightglass-${{ steps.version.outputs.next }}.zip" \
            custom.css custom.js src/ README.md \
            --exclude "*.DS_Store" "*.gitkeep"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            "nightglass-${{ steps.version.outputs.next }}.zip" \
            --title "Nightglass ${{ steps.version.outputs.next }}" \
            --generate-notes \
            --latest
